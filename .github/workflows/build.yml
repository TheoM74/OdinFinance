name: Build Executables

on:
  push:
    tags:
      - "v*" # Se déclenche quand tu publies un tag (ex: v1.0.0)

jobs:
  build:
    name: Compiler pour ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            executable_ext: .exe
            separator: ";"
          - os: macos-latest
            name: macOS
            executable_ext: ""
            separator: ":"

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compiler avec PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconsole --onedir --name "OdinFinance" --add-data "resources${{ matrix.separator }}resources" main.py

      - name: Compiler avec PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconsole --onedir --name "OdinFinance" --add-data "resources${{ matrix.separator }}resources" main.py

      - name: Compresser le résultat (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\OdinFinance -DestinationPath OdinFinance-Windows.zip

      - name: Compresser le résultat (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../OdinFinance-macOS.zip OdinFinance.app

      - name: Publier les exécutables dans la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OdinFinance-Windows.zip
            OdinFinance-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
