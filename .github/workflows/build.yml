name: Build Executables

# Sur main : compilation et vérification sur les trois systèmes, sans publication.
# Sur un tag v* : même chose, puis publication d'une seule Release avec les trois archives.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compiler pour ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            separator: ";"
          - os: macos-latest
            name: macOS
            separator: ":"
          # 22.04 plutôt que la dernière version : l'exécutable dépend de la glibc du système de compilation,
          # une version plus ancienne le rend utilisable sur plus de distributions.
          - os: ubuntu-22.04
            name: Linux
            separator: ":"

    env:
      # L'autotest s'exécute sans écran sur les machines de build
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les bibliothèques système de Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests unitaires
        run: python -m unittest discover -s tests -t . -v

      - name: Compiler avec PyInstaller
        run: pyinstaller --noconfirm --noconsole --onedir --name "OdinFinance" --add-data "resources${{ matrix.separator }}resources" main.py

      - name: Vérifier l'exécutable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\OdinFinance\OdinFinance.exe -ArgumentList "--autotest" -Wait -PassThru -WorkingDirectory $PWD
          Get-Content odinfinance-autotest.log -ErrorAction SilentlyContinue
          exit $p.ExitCode

      - name: Vérifier l'exécutable (macOS)
        if: runner.os == 'macOS'
        run: |
          code=0
          dist/OdinFinance.app/Contents/MacOS/OdinFinance --autotest || code=$?
          cat odinfinance-autotest.log || true
          exit $code

      - name: Vérifier l'exécutable (Linux)
        if: runner.os == 'Linux'
        run: |
          code=0
          dist/OdinFinance/OdinFinance --autotest || code=$?
          cat odinfinance-autotest.log || true
          exit $code

      - name: Compresser le résultat (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force release-windows | Out-Null
          Copy-Item -Recurse dist\OdinFinance release-windows\OdinFinance
          Copy-Item README.md, LICENSE release-windows\
          Compress-Archive -Path release-windows\* -DestinationPath OdinFinance-Windows.zip

      - name: Compresser le résultat (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir release-macos
          cp -R dist/OdinFinance.app release-macos/
          cp README.md LICENSE release-macos/
          cd release-macos
          zip -y -r ../OdinFinance-macOS.zip .

      - name: Compresser le résultat (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir release-linux
          cp -R dist/OdinFinance release-linux/
          cp README.md LICENSE release-linux/
          tar -czf OdinFinance-Linux.tar.gz -C release-linux .

      - name: Conserver l'archive
        uses: actions/upload-artifact@v4
        with:
          name: OdinFinance-${{ matrix.name }}
          path: OdinFinance-*.*
          if-no-files-found: error

  release:
    name: Publier la Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Récupérer les trois archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Publier les exécutables dans la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: OdinFinance ${{ github.ref_name }}
          body_path: notes-de-version/${{ github.ref_name }}.md
          files: archives/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
