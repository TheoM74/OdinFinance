name: Build Executables

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Compiler pour ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            separator: ";"
          - os: macos-latest
            name: macOS
            separator: ":"

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compiler avec PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconsole --onedir --name "OdinFinance" --add-data "resources${{ matrix.separator }}resources" main.py

      - name: Compiler avec PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconsole --onedir --name "OdinFinance" --add-data "resources${{ matrix.separator }}resources" main.py

      - name: Compresser le résultat (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force release-windows | Out-Null
          Copy-Item -Recurse dist\OdinFinance release-windows\OdinFinance
          Copy-Item README.md, LICENSE release-windows\
          Compress-Archive -Path release-windows\* -DestinationPath OdinFinance-Windows.zip

      - name: Compresser le résultat (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir release-macos
          cp -R dist/OdinFinance.app release-macos/
          cp README.md LICENSE release-macos/
          cd release-macos
          zip -y -r ../OdinFinance-macOS.zip .

      - name: Publier les exécutables dans la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OdinFinance-Windows.zip
            OdinFinance-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
